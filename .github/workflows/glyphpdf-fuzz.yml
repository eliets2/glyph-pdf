# fuzz/ci/clusterfuzzlite.yml
#
# ClusterFuzzLite-style CI leg for GlyphPDF, scoped to the fuzz/ apparatus.
# This is a GitHub Actions workflow. To activate, the OWNER copies it to
# .github/workflows/ (we do NOT write outside fuzz/). It runs:
#   1. the P1/P2 redaction oracle matrix (gcc build, no sanitizer needed), and
#   2. the libFuzzer djot target IF a clang toolchain is provisioned.
#
# PR-triggered (short) + scheduled (longer batch).
#
# CX-13: the redaction-oracles job now provisions the SAME dependencies as
# ci.yml — the vendored PoDoFo 1.1.0 bootstrap (pinned to commit SHA
# 712fb0e80e0e9404525d8db54fa0baa4ae469963, shared cache key), ONNX Runtime
# 1.17.3 (the driver links onnxruntime.lib), the PDFium runtime DLL (the
# import lib is tracked, the runtime DLL is not), OpenSSL and the full
# MSYS2 dep set — plus clang. Without them the job used to die at
# "cmake: command not found" (run 33301931392) or would fail later at the
# engine configure/build; the clang driver step was never reached.
# The path filter now also covers the whole engine tree
# (src/engines/**, src/core/Redaction*), not only src/engines/podofo/**.

name: glyphpdf-fuzz
on:
  pull_request:
    paths:
      - 'src/engines/**'
      - 'src/core/Redaction*'
      - 'src/pdfws_djot/**'
      - 'fuzz/**'
  schedule:
    - cron: '0 3 * * *'   # nightly batch
  workflow_dispatch: {}

jobs:
  redaction-oracles:
    # Runs on a Windows runner with MSYS2/ucrt64 to match the dev toolchain.
    # C1 (SWEEP-W3-DEVOPS §7.1): windows-2022, not windows-latest — the
    # image flip must be a pinned, reviewable decision.
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          # Same dep set as ci.yml (minus only the Qt tools/translations/
          # imageformats extras) + clang: the driver today links with g++,
          # but clang stays provisioned so the ASan driver variant and the
          # harness builds never hit a missing toolchain mid-job.
          # qt6-svg is REQUIRED, not a UI extra: the top-level find_package
          # (CMakeLists.txt:123) hard-requires the Svg component, so the old
          # trimmed list could not even configure the engine — found by the
          # CX-13 acceptance dispatch on 2026-09-29 (run 36643482560, job
          # redaction-oracles: 'Failed to find required Qt component "Svg"').
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-pdf
            mingw-w64-ucrt-x86_64-podofo
            mingw-w64-ucrt-x86_64-qpdf
            mingw-w64-ucrt-x86_64-quickjs-ng
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-tesseract-ocr
            mingw-w64-ucrt-x86_64-tesseract-data-eng
            mingw-w64-ucrt-x86_64-leptonica
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-openjpeg2
            mingw-w64-ucrt-x86_64-fontconfig
            python
      # The CMake quickjs pin guard (GLYPHPDF_QUICKJS_PIN) enforces 0.15.1
      # (PGR-40). Same refresh as ci.yml so the guarded configure matches.
      - name: Sync quickjs-ng to the pinned release
        shell: msys2 {0}
        run: pacman -Sy --needed --noconfirm mingw-w64-ucrt-x86_64-quickjs-ng

      # The engine code requires podofo 1.1.0 (MSYS2 ships older); build the
      # vendored prefix exactly like ci.yml — pinned to a commit SHA, cached,
      # SHA in the cache key (see ci.yml for the rationale).
      - name: Restore vendored podofo cache
        id: podofo-cache
        uses: actions/cache@v4
        with:
          path: third_party/podofo/install
          key: podofo-1.1.0-g712fb0e80e0e9404525d8db54fa0baa4ae469963-ucrt64-r1

      - name: Build vendored podofo 1.1.0
        if: steps.podofo-cache.outputs.cache-hit != 'true'
        run: |
          git init podofo-src
          git -C podofo-src fetch --depth 1 https://github.com/podofo/podofo.git 712fb0e80e0e9404525d8db54fa0baa4ae469963
          git -C podofo-src checkout FETCH_HEAD
          cmake -S podofo-src -B podofo-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPODOFO_BUILD_TOOLS=OFF \
            -DPODOFO_BUILD_TEST=OFF \
            -DPODOFO_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/third_party/podofo/install"
          cmake --build podofo-src/build --parallel
          cmake --install podofo-src/build

      # The driver links onnxruntime.lib; the oracle run needs
      # onnxruntime.dll on PATH (the build stages runtime DLLs into build/).
      - name: Download ONNX Runtime
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v1.17.3/onnxruntime-win-x64-1.17.3.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip -TimeoutSec 180
          $expected = "356A33D024F2709786BEBD5D4CA06CD5392875DA95DAA0455AAE72EDC8993256"
          $actual = (Get-FileHash ort.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { Write-Error "ORT checksum mismatch"; exit 1 }
          Expand-Archive -Path ort.zip -DestinationPath . -Force
          Remove-Item ort.zip

      # The pdfium import lib is tracked, the runtime DLL is not — stage it
      # exactly like ci.yml so the engine build (HAS_PDFIUM) and the driver's
      # runtime both resolve.
      - name: Download PDFium runtime DLL
        shell: pwsh
        run: |
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7834/pdfium-win-x64.tgz"
          Invoke-WebRequest -Uri $url -OutFile pdfium.tgz -TimeoutSec 180
          New-Item -ItemType Directory -Force pdfium-extract | Out-Null
          tar -xzf pdfium.tgz -C pdfium-extract
          $expected = "A487E1D2A18F164ADC3A17AACEE158787FA86049E6D91D3712B0A43F745E6905"
          $actual = (Get-FileHash pdfium-extract/bin/pdfium.dll -Algorithm SHA256).Hash
          if ($actual -ne $expected) { Write-Error "pdfium.dll checksum mismatch: $actual"; exit 1 }
          New-Item -ItemType Directory -Force third_party/pdfium/bin | Out-Null
          Copy-Item pdfium-extract/bin/pdfium.dll third_party/pdfium/bin/pdfium.dll
          Remove-Item pdfium.tgz; Remove-Item -Recurse -Force pdfium-extract

      - name: Configure + build engine (cached)
        run: |
          # Owner's normal build of pdfws_engines into build/ (see root README).
          # This step is project-specific; reuse the existing build cache.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          # stage_runtime_dlls: `--target <list>` does NOT run other ALL
          # targets, and without it build/ lacks libpodofo.dll, pdfium.dll and
          # onnxruntime.dll — the driver would die at load (0xC0000135) and
          # every oracle case would report DRIVER FAILED. The comment below
          # ("the build stages runtime DLLs into build/") was aspirational
          # until this target joined the list.
          cmake --build build --target pdfws_engines pdfws_commands pdfws_djot docmodel liblua libjbig2enc stage_runtime_dlls
      - name: Build redaction driver
        run: bash fuzz/build_clang/build_redaction_driver.sh
      - name: Run P1/P2 oracle matrix (fails CI on residual leak regression)
        run: |
          # INF06: the pipeline exit code is the ORACLE exit code, not tee's —
          # without pipefail a failing campaign used to come out green.
          set -o pipefail
          bash fuzz/run_oracles.sh 2>&1 | tee fuzz/scratch/ci_oracles.log
          # Belt-and-braces on the log itself (run_oracles.sh already exits
          # non-zero for DRIVER/ORACLE failures; this also guards older logs).
          if grep -E 'DRIVER FAILED|ORACLE FAILED' fuzz/scratch/ci_oracles.log; then
            echo "REGRESSION: a driver/oracle failure occurred — the gate cannot be green"; exit 1
          fi
          # Gate: identity/scale/skew MUST stay CLEAN. Rotation cases are the
          # KNOWN F-02 finding -> tracked separately; once patched they must
          # flip to CLEAN and this grep becomes the regression guard.
          if grep -E '\[(identity|scale3x|skewx)\].*LEAK' fuzz/scratch/ci_oracles.log; then
            echo "REGRESSION: a previously-clean redaction case now leaks"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-reports
          path: fuzz/scratch/*.json

  djot-libfuzzer:
    # INF06: this job is a security gate — a green result must mean the harness
    # BUILT, RAN, and survived without a finding. Build failures, a missing
    # executable and fuzzer findings now FAIL the job (no `|| echo`, no
    # `|| true`, no skip-if-missing). Crash artifacts are still uploaded via
    # `if: always()` so the failure keeps its evidence.
    # If this configuration is ever deliberately unavailable, represent that
    # as an explicit job-level skip condition — never as a successful run.
    # qt6-base-dev + pkg-config: since M6-P4 D3 the pdfws_djot chain includes
    # <QString> (DjotToRichTextXhtml), so build_djot_clang.sh resolves QtCore
    # through pkg-config and fails honestly when it is missing (found by the
    # CX-13 acceptance dispatch on 2026-09-29 — run 36643482560, job
    # djot-libfuzzer: "fatal error: 'QString' file not found").
    # The SAME dispatch chain then exposed the chain's podofo include
    # (PdfStructureMapper.cpp:39 <podofo/podofo.h>, run 36644229748), so the
    # job also builds the SAME pinned vendored podofo 1.1.0 the engine and
    # the redaction-oracles job use — never a distro podofo whose API drifts
    # against the pin.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + libFuzzer + Qt6 Core + freetype
        # libjpeg/libpng/zlib/libssl/libxml2 -dev: pinned so podofo's static
        # configure picks the SAME optional set every run (deterministic link
        # deps; PdfXMPPacket uses libxml2 for XMP).
        run: sudo apt-get update && sudo apt-get install -y clang qt6-base-dev pkg-config libfreetype-dev libjpeg-dev libpng-dev zlib1g-dev libssl-dev libxml2-dev
      - name: Restore vendored podofo cache (ubuntu)
        id: podofo-cache-lx
        uses: actions/cache@v4
        with:
          path: third_party/podofo/install
          key: podofo-1.1.0-g712fb0e80e0e9404525d8db54fa0baa4ae469963-linux-r1
      - name: Build vendored podofo 1.1.0 (ubuntu)
        if: steps.podofo-cache-lx.outputs.cache-hit != 'true'
        run: |
          git init podofo-src
          git -C podofo-src fetch --depth 1 https://github.com/podofo/podofo.git 712fb0e80e0e9404525d8db54fa0baa4ae469963
          git -C podofo-src checkout FETCH_HEAD
          # Static per podofo 1.1.0's own rule (its CMakeLists.txt:89 refuses
          # an external PODOFO_BUILD_SHARED: 'Set PODOFO_BUILD_STATIC to TRUE
          # if you need a static build') — found by acceptance run
          # 36646070984; a static libpodofo.a also spares the fuzzer a
          # runtime .so dependency.
          cmake -S podofo-src -B podofo-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPODOFO_BUILD_TOOLS=OFF \
            -DPODOFO_BUILD_TEST=OFF \
            -DPODOFO_BUILD_EXAMPLES=OFF \
            -DPODOFO_BUILD_STATIC=TRUE \
            -DCMAKE_INSTALL_PREFIX="$PWD/third_party/podofo/install"
          cmake --build podofo-src/build --parallel
          cmake --install podofo-src/build
      - name: Build djot fuzzer (clang)
        run: bash fuzz/build_clang/build_djot_clang.sh
      - name: Short fuzz run (PR smoke)
        # LeakSanitizer off on purpose (same rationale as the CX-15 gate):
        # the harness now links the uninstrumented Qt6Core, and LSan over
        # Qt's allocator is noise — the gate targets memory errors and UB.
        # LD_LIBRARY_PATH: belt-and-braces if podofo still installs a shared
        # lib despite PODOFO_BUILD_SHARED=OFF (a static libpodofo.a needs
        # nothing at runtime).
        env:
          ASAN_OPTIONS: detect_leaks=0
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/podofo/install/lib
        run: |
          if [ ! -x fuzz/bin/djot_fuzzer ]; then
            echo "FAIL: fuzz/bin/djot_fuzzer missing — the harness must be built before this job can be green (INF06)" >&2
            exit 1
          fi
          ./fuzz/bin/djot_fuzzer -dict=fuzz/dict/djot.dict -max_total_time=120 \
            -timeout=10 fuzz/corpus/djot/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: djot-crashes
          path: |
            crash-*
            timeout-*
