ReleaseNotes: >-
  Maintenance release: removed placeholder data from the OCR Verify screen;
  in-app updates fully wired (on-launch banner + a polished update dialog with
  release notes, progress, and SHA-256/signature verification); a branded MSI
  installer wizard with a 'Launch GlyphPDF' finish option. Includes all v1.3.0
  features and the v1.2.x stability/security fixes.
