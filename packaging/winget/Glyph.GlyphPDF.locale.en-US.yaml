ShortDescription: A privacy-first PDF workstation for Windows -- no telemetry, no cloud, no subscription.
Description: >-
  GlyphPDF is an open-source PDF workstation for Windows. It edits, annotates,
  signs (PAdES B-LT/B-LTA), redacts, OCRs (ROVER ensemble, fully offline), and
  compresses PDF documents on your machine. No telemetry, no cloud, no subscription.
Moniker: glyphpdf
Tags:
- pdf
- pdf-editor
- ocr
- digital-signature
- privacy
- offline
ReleaseNotes: >-
  Security patch release. Removes OCSP test-fixture bypass from production builds
  (SECFIX-1), fixes AES downgrade oracle (SECFIX-2), TOCTOU in update checker
  (SECFIX-3), unbounded recursion in signature manager (SECFIX-4), and Ollama
  data-exfiltration vector (SECFIX-5). Also fixes undo-history corruption
  (ARCHFIX-1) and HTTP semaphore timeout (ARCHFIX-1).
ReleaseNotesUrl: https://github.com/eliets2/glyph-pdf/releases/tag/v1.2.0
