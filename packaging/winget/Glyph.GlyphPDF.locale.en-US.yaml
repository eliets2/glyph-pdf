- pdf
- pdf-editor
- ocr
- digital-signature
- privacy
- offline
ReleaseNotes: >-
  Patch release fixing a startup crash on all v1.0.x and v1.2.0 installs.
  deploy.ps1 was bundling the ABI-incompatible MSYS2 podofo 0.10.4 instead
  of the vendored podofo 1.1.0 that GlyphPDF.exe was linked against, causing
  an "Entry Point Not Found" crash for PdfContent::PdfContent() on every launch.
  Also includes all v1.2.0 security fixes (SECFIX-1 through SECFIX-5).
ReleaseNotesUrl: https://github.com/eliets2/glyph-pdf/releases/tag/v1.2.1
